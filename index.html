<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Video & Reels Downloader - No Watermark</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; width: 100%; max-width: 600px; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 1rem; }
        .input-area { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 15px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #0ea5e9; }
        .result-area { display: none; margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 8px; text-align: center; }
        .download-btn { background: #22c55e; color: white; text-decoration: none; display: inline-block; padding: 12px 25px; border-radius: 8px; font-weight: bold; margin-top: 15px; }
        .download-btn:hover { background: #16a34a; }
        .ad-box { margin-top: 30px; padding: 20px; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video & Reels Downloader</h1>
        <p>Download Instagram Reels, TikTok, and Facebook Videos in HD with No Watermark.</p>
        
        <div class="input-area">
            <input type="text" id="videoUrl" placeholder="Paste video or reels link here...">
            <button onclick="downloadVideo()">Download Now</button>
        </div>

        <div class="result-area" id="resultArea">
            <h3 style="color: #22c55e;">Link Generated Successfully!</h3>
            <p style="margin-bottom: 10px; color: #fff;">Click the button below to open the download server:</p>
            <a href="#" id="downloadLink" target="_blank" class="download-btn">Go to Download Server</a>
        </div>

        <div class="ad-box">
            Advertisement Place (Google AdSense)
        </div>
    </div>

    <script>
        function downloadVideo() {
            const url = document.getElementById('videoUrl').value;
            const resultArea = document.getElementById('resultArea');
            const downloadLink = document.getElementById('downloadLink');

            if(!url) {
                alert('Please paste a video link first!');
                return;
            }

            // ਇਹ ਸਿਸਟਮ ਲਿੰਕ ਨੂੰ ਸਿੱਧਾ ਡਾਊਨਲੋਡ ਸਰਵਰ ਤੇ ਭੇਜੇਗਾ ਬਿਨਾਂ ਬਲਾਕ ਹੋਏ
            let cleanUrl = encodeURIComponent(url);
            let finalDownloadUrl = https://www.google.com/url?q=https://api.vkrproductions.com/api/v1/downloader?url=${cleanUrl};

            downloadLink.href = finalDownloadUrl;
            resultArea.style.display = 'block';
        }
    </script>

</body>
</html>
